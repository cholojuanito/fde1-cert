<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" role="img" aria-labelledby="title desc">
<title id="title">The mask leaves the model nothing else to pick</title>
<desc id="desc">Next-token probabilities from a recorded forward pass on "The capital of France is", softmax over the 1,000 recorded candidates. Before the mask, " Paris" has 89.3% and words like " located" (3.2%) and " known" (1.9%) follow. The mask keeps only tokens that, stripped and lower-cased, are in the allowed set paris, london, berlin, madrid, rome, dublin. Eight tokens survive, including the spellings " paris" and "Paris". Together they held 89.4% of the probability mass. After renormalising, " Paris" has 99.9%. The top token is the same before and after, which is what a well-fitted constraint looks like.</desc>
