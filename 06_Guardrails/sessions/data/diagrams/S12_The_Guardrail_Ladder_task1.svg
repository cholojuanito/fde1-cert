<rect class="bg" x="0" y="0" width="960" height="572" rx="16"/>

<text class="title" x="32" y="40">The mask leaves the model nothing else to pick</text>
<text class="subtitle" x="32" y="62">Zero every token outside the allowed set, then renormalise. The share of mass it kept says whether the set fits.</text>

<rect class="node-accent" x="32" y="84" width="288" height="64" rx="10"/>
<text class="title t-accent" x="52" y="114">89.4<tspan class="label t-accent">%</tspan></text>
<text class="small" x="52" y="134">probability mass the mask kept</text>
<rect class="node" x="336" y="84" width="288" height="64" rx="10"/>
<text class="title" x="356" y="114">8<tspan class="label"> of 1,000</tspan></text>
<text class="small" x="356" y="134">tokens left with any probability</text>
