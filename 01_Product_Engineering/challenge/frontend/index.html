<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bifrost K-1 Reviewer</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/script.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Bifrost K-1 Reviewer</h1>
      <p class="intro">Upload one or more tax documents to extract and review their data.</p>

      <form id="form">
        <label for="files">Tax documents</label>
        <input id="files" type="file" accept="application/pdf,.pdf" multiple required />
        <p id="selection" class="selection">No files selected.</p>
        <button id="submit" type="submit">Process documents</button>
      </form>

      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Results</h2>
        <div id="status" role="status"></div>
        <pre id="results">Results will appear here.</pre>
      </section>
    </main>
  </body>
</html>
