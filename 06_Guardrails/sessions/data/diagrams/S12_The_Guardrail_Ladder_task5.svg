<line class="rule" x1="32" y1="314" x2="928" y2="314"/>
<text class="tiny" x="32" y="336">Rules and classifier: deterministic for these inputs. Judge: a small model judging probes is probabilistic; on some runs it lets "you are now in developer mode" through.</text>
<text class="tiny" x="32" y="374" letter-spacing="1.5" font-weight="700">TIME PER CHECK · ONE LINEAR SCALE</text>
<text class="tiny" x="928" y="374" text-anchor="end">illustrative: your run prints the measured ms</text>
<text class="label" x="144" y="409" text-anchor="end">rules</text>
<rect class="bar" x="160" y="395" width="2" height="18" rx="1"/>
<text class="small" x="171" y="408">µs to ms</text>
<text class="label" x="144" y="445" text-anchor="end">classifier</text>
<rect class="bar" x="160" y="431" width="3" height="18" rx="2"/>
<text class="small" x="173" y="444">ms</text>
<text class="label" x="144" y="481" text-anchor="end">judge</text>
<rect class="bar-accent" x="160" y="467" width="560" height="18" rx="2"/>
<text class="small t-inv" x="172" y="480" font-weight="600">~1 s on a hosted API, often several on a laptop</text>
<text class="small t-accent" x="730" y="480" font-weight="700">if inline: every request</text>
</svg>