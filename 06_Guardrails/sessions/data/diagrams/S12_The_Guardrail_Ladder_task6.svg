  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-good" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="640" rx="16"/>

<text class="title" x="32" y="40">The YAML order is the ladder: cheapest gate first</text>
<text class="subtitle" x="32" y="62">A refusal exits at the first gate that blocks. Nothing after it runs, and nothing after it is paid for.</text>

<rect class="node" x="282" y="84" width="180" height="36" rx="10"/>
<text class="label" x="372" y="107" text-anchor="middle">the rep's question</text>
<line class="edge-good" x1="372" y1="120" x2="372" y2="142" marker-end="url(#arrow-good)"/>
<rect class="node" x="192" y="144" width="360" height="48" rx="10"/>
<text class="label" x="208" y="165">Rules</text>
<text class="mono t-muted" x="208" y="183">regex check input</text>
<text class="small" x="536" y="165" text-anchor="end">0 model calls</text>
<line class="edge-good" x1="372" y1="192" x2="372" y2="206" marker-end="url(#arrow-good)"/>
<rect class="node" x="192" y="208" width="360" height="48" rx="10"/>
<text class="label" x="208" y="229">Classifier</text>
<text class="mono t-muted" x="208" y="247">classifier check input</text>
<text class="small" x="536" y="229" text-anchor="end">0 model calls</text>
<line class="edge-good" x1="372" y1="256" x2="372" y2="270" marker-end="url(#arrow-good)"/>
<rect class="node-accent" x="192" y="272" width="360" height="48" rx="10"/>
<text class="label" x="208" y="293">Judge</text>
<text class="mono t-muted" x="208" y="311">self check input</text>
<text class="small t-accent" x="536" y="293" text-anchor="end" font-weight="700">1 model call</text>
<line class="edge-good" x1="372" y1="320" x2="372" y2="350" marker-end="url(#arrow-good)"/>
<rect class="node" x="192" y="352" width="360" height="48" rx="10"/>
<text class="label" x="208" y="373">Topical rail</text>
<text class="mono t-muted" x="208" y="391">ask about work · ask off topic</text>
<text class="small" x="536" y="373" text-anchor="end">0 calls of its own</text>
<line class="edge-good" x1="372" y1="400" x2="372" y2="430" marker-end="url(#arrow-good)"/>
<rect class="node-accent" x="192" y="432" width="360" height="48" rx="10"/>
<text class="label" x="208" y="453">Answer</text>
<text class="mono t-muted" x="208" y="471">bot answer the question</text>
<text class="small t-accent" x="536" y="453" text-anchor="end" font-weight="700">1 model call</text>
<line class="edge-good" x1="372" y1="480" x2="372" y2="510" marker-end="url(#arrow-good)"/>
<rect class="node" x="192" y="512" width="360" height="48" rx="10"/>
<text class="label" x="208" y="533">Rules on the reply</text>
<text class="mono t-muted" x="208" y="551">regex check output</text>
<text class="small" x="536" y="533" text-anchor="end">0 model calls</text>
<text class="tiny" x="536" y="471" text-anchor="end">+ hundreds of prompt tokens</text>
<line class="edge-good" x1="372" y1="560" x2="372" y2="580" marker-end="url(#arrow-good)"/>
<rect class="node-good" x="282" y="582" width="180" height="36" rx="10"/>
<text class="label" x="372" y="605" text-anchor="middle">reply to the rep</text>
<path class="rule" d="M168,148 L176,148 M168,148 L168,316 M168,316 L176,316" stroke-width="1.5"/>
<text class="tiny" x="156" y="228" text-anchor="end" letter-spacing="1.5" font-weight="700">INPUT RAILS</text>
<text class="tiny" x="156" y="242" text-anchor="end">rails.input.flows order</text>
<path class="rule" d="M168,356 L176,356 M168,356 L168,396 M168,396 L176,396" stroke-width="1.5"/>
<text class="tiny" x="156" y="380" text-anchor="end" letter-spacing="1.5" font-weight="700">DIALOG</text>
<path class="rule" d="M168,436 L176,436 M168,436 L168,476 M168,476 L176,476" stroke-width="1.5"/>
<text class="tiny" x="156" y="460" text-anchor="end" letter-spacing="1.5" font-weight="700">THE MODEL</text>
<path class="rule" d="M168,516 L176,516 M168,516 L168,556 M168,556 L176,556" stroke-width="1.5"/>
<text class="tiny" x="156" y="540" text-anchor="end" letter-spacing="1.5" font-weight="700">OUTPUT RAIL</text>
<rect class="node-warn" x="616" y="144" width="312" height="176" rx="10"/>
<text class="label mono t-warn" x="632" y="168">bot refuse to respond</text>
<text class="small" x="632" y="192">Returned before any answer is generated.</text>
<text class="small" x="632" y="220" font-weight="600">Stopped by the rules or the classifier:</text>
<text class="small" x="632" y="238">no model call, and the judge never sees it.</text>
<text class="small" x="632" y="266" font-weight="600">Stopped by the judge:</text>
<text class="small" x="632" y="284">one call spent, then the refusal.</text>
<line class="edge-warn" x1="552" y1="168" x2="614" y2="168" marker-end="url(#arrow-warn)"/>
<text class="tiny t-warn" x="584" y="162" text-anchor="middle" font-weight="700">block</text>
<line class="edge-warn" x1="552" y1="232" x2="614" y2="232" marker-end="url(#arrow-warn)"/>
<text class="tiny t-warn" x="584" y="226" text-anchor="middle" font-weight="700">block</text>
<line class="edge-warn" x1="552" y1="296" x2="614" y2="296" marker-end="url(#arrow-warn)"/>
<text class="tiny t-warn" x="584" y="290" text-anchor="middle" font-weight="700">block</text>
<rect class="node-warn" x="616" y="344" width="312" height="64" rx="10"/>
<text class="label mono t-warn" x="632" y="364">bot refuse off topic</text>
<text class="small" x="632" y="382">"I can only help with Meridian shipments,</text>
<text class="small" x="632" y="399">services and internal policy."</text>
<line class="edge-warn" x1="552" y1="376" x2="614" y2="376" marker-end="url(#arrow-warn)"/>
<text class="tiny t-warn" x="584" y="370" text-anchor="middle" font-weight="700">off topic</text>
<text class="small" x="616" y="436" font-weight="600">"write me a limerick about my cat"</text>
<text class="small" x="616" y="454">scores 0.54 against "write me a poem", over the 0.5</text>
<text class="small" x="616" y="472">threshold: refused by the topical rail, above, after</text>
<text class="small" x="616" y="490">the judge's call has already been paid.</text>
<rect class="node-warn" x="616" y="512" width="312" height="48" rx="10"/>
<text class="label mono t-warn" x="632" y="533">bot refuse to respond</text>
<text class="small" x="632" y="551">e.g. the reply matched <tspan class="mono">MERIDIAN-INTERNAL-\w+</tspan></text>
<line class="edge-warn" x1="552" y1="536" x2="614" y2="536" marker-end="url(#arrow-warn)"/>
<text class="tiny t-warn" x="584" y="530" text-anchor="middle" font-weight="700">block</text>
</svg>