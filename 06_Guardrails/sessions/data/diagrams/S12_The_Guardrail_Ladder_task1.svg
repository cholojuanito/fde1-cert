<text class="small" x="32" y="528">Allowed set: <tspan class="mono">paris, london, berlin, madrid, rome, dublin</tspan>, matched after strip and lower-case, so <tspan class="mono">" paris"</tspan> and <tspan class="mono">"Paris"</tspan> count too.</text>
<text class="tiny" x="32" y="548">Recorded forward pass of LiquidAI/LFM2.5-350M on "The capital of France is". Bars share one linear scale per side.</text>
